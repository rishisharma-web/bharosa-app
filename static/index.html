<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bharosa (backend preview)</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #F5F5F7; color: #111418; }
  pre { background: #fff; padding: 12px; border-radius: 12px; overflow: auto; max-height: 70vh; }
  #trace div { font-family: ui-monospace, monospace; font-size: 12px; }
</style>
</head>
<body>
<!-- Placeholder until the real UI (static/ is owned by the frontend build). Shows the live SSE feed. -->
<h1>Bharosa backend preview</h1>
<p>Sim time: <b id="now">…</b> · <button onclick="fetch('/api/demo/reset',{method:'POST'})">Reset</button></p>
<div id="trace"></div>
<pre id="snap">connecting…</pre>
<script>
  const es = new EventSource('/api/stream');
  es.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'snapshot') {
      document.getElementById('now').textContent = msg.data.now;
      document.getElementById('snap').textContent = JSON.stringify(msg.data, null, 2);
    } else {
      const d = document.createElement('div');
      d.textContent = `[${msg.type}] ` + JSON.stringify(msg.data);
      const t = document.getElementById('trace');
      t.prepend(d);
      while (t.children.length > 12) t.lastChild.remove();
    }
  };
</script>
</body>
</html>
