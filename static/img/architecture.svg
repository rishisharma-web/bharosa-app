<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Inter, Segoe UI, system-ui, sans-serif" role="img" aria-label="Bharosa architecture">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A94A6"/>
    </marker>
    <style>
      .grp { font-size: 12px; font-weight: 800; letter-spacing: .08em; fill: #8A94A6; text-transform: uppercase; }
      .lbl { font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .surface rect { fill: #FFFFFF; stroke: #CBD2DC; stroke-width: 1.5; }
      .surface text { fill: #111418; }
      .agent rect { fill: #F2FCFF; stroke: #00BAF2; stroke-width: 2; }
      .agent text { fill: #042E6F; }
      .core rect { fill: #042E6F; stroke: #042E6F; stroke-width: 2; }
      .core text { fill: #FFFFFF; }
      .adapter rect { fill: #EEF0F3; stroke: #B8C0CC; stroke-width: 1.5; }
      .adapter text { fill: #4A5568; }
      .infra rect { fill: #FFF4E0; stroke: #E08A00; stroke-width: 1.5; }
      .infra text { fill: #7A4B00; }
      .flow { stroke: #B8C0CC; stroke-width: 1.6; fill: none; marker-end: url(#arw); }
      .zone { fill: #F7F8FA; stroke: #E6E8EC; stroke-width: 1; }
    </style>
  </defs>

  <!-- zones -->
  <rect class="zone" x="10" y="10" width="980" height="88" rx="18"/>
  <text class="grp" x="26" y="32">Paytm surfaces</text>
  <rect class="zone" x="10" y="190" width="300" height="300" rx="18"/>
  <text class="grp" x="26" y="212">Agents (propose)</text>
  <rect class="zone" x="330" y="190" width="420" height="300" rx="18"/>
  <text class="grp" x="346" y="212">Core (decides)</text>
  <rect class="zone" x="770" y="190" width="220" height="300" rx="18"/>
  <text class="grp" x="786" y="212">Adapters</text>
  <rect class="zone" x="10" y="510" width="980" height="120" rx="18"/>
  <text class="grp" x="26" y="532">Data &amp; realtime</text>

  <!-- surfaces -->
  <g id="soundbox" class="node surface"><rect x="150" y="40" width="190" height="44" rx="12"/><text class="lbl" x="245" y="62">Soundbox</text></g>
  <g id="merchant_app" class="node surface"><rect x="405" y="40" width="190" height="44" rx="12"/><text class="lbl" x="500" y="62">Merchant app</text></g>
  <g id="customer_app" class="node surface"><rect x="660" y="40" width="190" height="44" rx="12"/><text class="lbl" x="755" y="62">Customer app</text></g>

  <!-- router -->
  <g id="router" class="node infra"><rect x="330" y="118" width="340" height="50" rx="14"/><text class="lbl" x="500" y="143">Event router · validate → persist → dispatch</text></g>

  <!-- agents -->
  <g id="counter_agent" class="node agent"><rect x="28" y="228" width="160" height="44" rx="12"/><text class="lbl" x="108" y="250">Counter Agent</text></g>
  <g id="recovery_agent" class="node agent"><rect x="28" y="286" width="160" height="44" rx="12"/><text class="lbl" x="108" y="308">Recovery Agent</text></g>
  <g id="recon_agent" class="node agent"><rect x="28" y="344" width="160" height="44" rx="12"/><text class="lbl" x="108" y="366">Reconciliation Agent</text></g>
  <g id="munim_agent" class="node agent"><rect x="28" y="402" width="160" height="44" rx="12"/><text class="lbl" x="108" y="424">Munim Agent</text></g>
  <g id="validator" class="node infra"><rect x="206" y="228" width="88" height="218" rx="12"/><text class="lbl" x="250" y="330">Valid-</text><text class="lbl" x="250" y="348">ators</text></g>

  <!-- core -->
  <g id="ledger" class="node core"><rect x="348" y="228" width="124" height="44" rx="12"/><text class="lbl" x="410" y="250">Ledger</text></g>
  <g id="risk" class="node core"><rect x="486" y="228" width="124" height="44" rx="12"/><text class="lbl" x="548" y="250">Risk engine</text></g>
  <g id="score" class="node core"><rect x="624" y="228" width="110" height="44" rx="12"/><text class="lbl" x="679" y="250">Score</text></g>
  <g id="reconcile" class="node core"><rect x="348" y="290" width="124" height="44" rx="12"/><text class="lbl" x="410" y="312">Reconcile</text></g>
  <g id="mandate" class="node core"><rect x="486" y="290" width="124" height="44" rx="12"/><text class="lbl" x="548" y="312">Mandates</text></g>
  <g id="forecast" class="node core"><rect x="624" y="290" width="110" height="44" rx="12"/><text class="lbl" x="679" y="312">Forecast</text></g>
  <g id="advance" class="node core"><rect x="348" y="352" width="190" height="44" rx="12"/><text class="lbl" x="443" y="374">Supplier Advance + split</text></g>
  <g id="integrity" class="node core"><rect x="552" y="352" width="182" height="44" rx="12"/><text class="lbl" x="643" y="374">Integrity (graph rules)</text></g>
  <text x="540" y="430" text-anchor="middle" font-size="12" fill="#8A94A6">Agents' tools are read-only · every write goes through the router</text>

  <!-- adapters -->
  <g id="llm" class="node adapter"><rect x="788" y="228" width="186" height="34" rx="10"/><text class="lbl" x="881" y="245">LLM gateway (Sarvam)</text></g>
  <g id="tts" class="node adapter"><rect x="788" y="270" width="186" height="34" rx="10"/><text class="lbl" x="881" y="287">TTS (Sarvam)</text></g>
  <g id="upi" class="node adapter"><rect x="788" y="312" width="186" height="34" rx="10"/><text class="lbl" x="881" y="329">UPI · AutoPay</text></g>
  <g id="lender" class="node adapter"><rect x="788" y="354" width="186" height="34" rx="10"/><text class="lbl" x="881" y="371">Lender (Partner NBFC)</text></g>
  <g id="distributor" class="node adapter"><rect x="788" y="396" width="186" height="34" rx="10"/><text class="lbl" x="881" y="413">Distributor</text></g>
  <text x="881" y="460" text-anchor="middle" font-size="12" fill="#8A94A6">Simulated, production-shaped</text>

  <!-- data / realtime -->
  <g id="db" class="node infra"><rect x="330" y="552" width="160" height="50" rx="14"/><text class="lbl" x="410" y="577">SQLite · event log</text></g>
  <g id="broadcaster" class="node infra"><rect x="510" y="552" width="200" height="50" rx="14"/><text class="lbl" x="610" y="577">Trace + SSE broadcaster</text></g>

  <!-- flows -->
  <path class="flow" d="M245 84 L400 118"/>
  <path class="flow" d="M500 84 L500 118"/>
  <path class="flow" d="M755 84 L600 118"/>
  <path class="flow" d="M380 168 L160 228"/>
  <path class="flow" d="M500 168 L500 228"/>
  <path class="flow" d="M188 337 L206 337"/>
  <path class="flow" d="M294 300 L348 300"/>
  <path class="flow" d="M734 250 L788 245"/>
  <path class="flow" d="M734 312 L788 329"/>
  <path class="flow" d="M538 374 L552 374"/>
  <path class="flow" d="M734 374 L788 371"/>
  <path class="flow" d="M188 424 C 260 470, 300 470, 348 380"/>
  <path class="flow" d="M500 490 L430 552"/>
  <path class="flow" d="M610 552 C 900 520, 960 140, 850 84"/>
</svg>
