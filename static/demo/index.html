<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bharosa · Presenter</title>
<link rel="stylesheet" href="/static/shared/tokens.css">
<link rel="stylesheet" href="/static/shared/base.css">
<style>
  body { background: #E9ECF2; }
  .stage { display: grid; grid-template-columns: minmax(420px, 1fr) 410px 410px; gap: 18px; padding: 14px 18px 0; align-items: start; }
  .col-title { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 6px 6px; display: flex; justify-content: space-between; }
  .frame { width: 100%; height: 780px; border: 0; border-radius: 26px; background: var(--bg); box-shadow: var(--shadow); }
  .phone { width: 390px; height: 780px; border-radius: 44px; background: #0E1116; padding: 10px; box-shadow: var(--shadow-lg); margin: 0 auto; }
  .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 34px; background: var(--bg); }
  .strip { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; margin: 14px 18px 18px; background: #fff; border-radius: 22px; box-shadow: var(--shadow); padding: 12px 16px; align-items: start; }
  .logins { display: flex; gap: 12px; }
  .login-qr { text-align: center; font-size: 12px; font-weight: 700; color: var(--ink); }
  .login-qr .qr-box { width: 112px; height: 112px; padding: 4px; border-width: 2px; }
  .acts { font-size: 13px; max-height: 128px; overflow-y: auto; }
  .acts div { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; padding: 2px 0; border-bottom: 1px solid #F1F2F5; }
  @media (max-height: 1000px) { .frame, .phone { height: 700px; } .phone { width: 360px; } }
</style>
<script src="/static/vendor/qrcode.min.js"></script>
<script src="/static/shared/format.js"></script>
<script src="/static/shared/api.js"></script>
<script defer src="/static/vendor/alpine.min.js"></script>
<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('presenter', () => ({
    F: window.F, keyOk: API.hasAdminKey(), key: '', logins: [], activity: [], resetting: false, error: '',
    async init() {
      if (this.keyOk) await this.load();
      API.on(() => true, () => { if (this.keyOk) this.loadActivity(); });
      setInterval(() => { if (this.keyOk) this.makeQrs(); }, 9 * 60 * 1000);  // login links last 10 minutes
    },
    async saveKey() { API.setAdminKey(this.key.trim()); this.keyOk = true; await this.load(); },
    async load() {
      try { await this.makeQrs(); await this.loadActivity(); this.error = ''; }
      catch (e) { this.error = e.message; if (e.status === 401) this.keyOk = false; }
    },
    async makeQrs() {
      const people = await API.get('/api/admin/customers', { admin: true });
      this.logins = await Promise.all(people.map(async p => ({ ...p, url: (await API.post('/api/admin/magic', { customer_id: p.customer_id }, { admin: true })).url })));
    },
    async loadActivity() { this.activity = await API.get('/api/activity?limit=10', { admin: true }); },
    async reset() {
      this.resetting = true;
      try { await API.post('/api/admin/reset', {}, { admin: true }); await this.load(); document.querySelectorAll('iframe').forEach(f => f.contentWindow.location.reload()); }
      catch (e) { this.error = e.message; } finally { this.resetting = false; }
    },
  }));
});
</script>
</head>
<body x-data="presenter" x-cloak>
  <div class="stage">
    <section><div class="col-title"><span>AI Soundbox (counter)</span><a href="/soundbox" target="_blank">open ↗</a></div>
      <iframe class="frame" src="/soundbox" title="Soundbox"></iframe></section>
    <section><div class="col-title"><span>Merchant app</span><a href="/merchant" target="_blank">open ↗</a></div>
      <div class="phone"><iframe src="/merchant" title="Merchant app"></iframe></div></section>
    <section><div class="col-title"><span>Customer app (no-phone fallback)</span><a href="/customer" target="_blank">open ↗</a></div>
      <div class="phone"><iframe src="/customer" title="Customer app"></iframe></div></section>
  </div>

  <div class="strip">
    <div>
      <template x-if="!keyOk">
        <form class="row" @submit.prevent="saveKey()"><input class="input" type="password" x-model="key" placeholder="Admin key" style="width:180px"><button class="btn btn-primary btn-sm">Unlock</button></form>
      </template>
      <div class="logins" x-show="keyOk">
        <template x-for="l in logins" :key="l.customer_id">
          <div class="login-qr"><a :href="l.url" target="_blank" class="qr-box" x-html="F.qr(l.url, '#111418')"></a><div x-text="F.first(l.name)"></div></div>
        </template>
      </div>
      <div class="small muted" x-show="keyOk" style="margin-top:4px">Scan to log in on a phone · one use each, refreshed every 9 minutes</div>
    </div>
    <div class="acts">
      <div x-show="error" class="small" style="color:var(--red)" x-text="error"></div>
      <template x-for="(a, i) in activity" :key="i"><div><span class="muted" x-text="F.time(a.ts)"></span><span x-text="a.text"></span>
        <span class="badge" :class="F.srcBadge(a.source)[1]" x-text="F.srcBadge(a.source)[0]"></span></div></template>
    </div>
    <div class="row" style="flex-direction:column;align-items:stretch">
      <button class="btn btn-outline" @click="reset()" :disabled="!keyOk || resetting"><span x-show="resetting" class="spinner"></span> Reset</button>
      <a class="btn btn-ghost btn-sm" href="/overview" target="_blank">Overview ↗</a>
    </div>
  </div>
</body>
</html>
